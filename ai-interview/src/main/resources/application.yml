spring:
  application:
    name: ai-interview
  config:
    import: optional:classpath:application-local.yml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_interview?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

server:
  address: 0.0.0.0
  port: 8101
  servlet:
    context-path: /api
    session:
      timeout: 30d
      cookie:
        max-age: 2592000
        same-site: lax

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:/mapper/**/*.xml

# 密钥不要写在这里。本地请用 application-local.yml 或环境变量
ai:
  apiKey: ${AI_API_KEY:}
  model: ${AI_MODEL:deepseek-v3-250324}
  # TTS：provider=browser 用浏览器 speechSynthesis；provider=volc 走火山语音合成
  tts:
    provider: ${AI_TTS_PROVIDER:browser}
    appId: ${AI_TTS_APP_ID:}
    accessToken: ${AI_TTS_ACCESS_TOKEN:}
    cluster: ${AI_TTS_CLUSTER:volcano_tts}
    voiceType: ${AI_TTS_VOICE_TYPE:BV001_streaming}
    encoding: mp3
    speedRatio: 1.0
    apiUrl: https://openspeech.bytedance.com/api/v1/tts
  # 语音识别：默认复用上方 tts 的 appId/accessToken（需在语音控制台开通录音文件识别）
  asr:
    enabled: ${AI_ASR_ENABLED:true}
    appId: ${AI_ASR_APP_ID:}
    accessToken: ${AI_ASR_ACCESS_TOKEN:}
    apiKey: ${AI_ASR_API_KEY:}
    resourceId: ${AI_ASR_RESOURCE_ID:volc.bigasr.auc}

# 阿里云知识点向量库（DashVector + DashScope Embedding）
# 密钥请写在 application-local.yml 或环境变量，勿提交到仓库
aliyun:
  dashscope:
    apiKey: ${DASHSCOPE_API_KEY:}
    embeddingModel: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v3}
  dashvector:
    enabled: ${DASHVECTOR_ENABLED:false}
    apiKey: ${DASHVECTOR_API_KEY:}
    endpoint: ${DASHVECTOR_ENDPOINT:}
    # 建议用新名称；旧的 interview_kp / interview_knowledge 若创建失败可换 interview_rag
    collection: ${DASHVECTOR_COLLECTION:interview_rag}
    dimension: 1024
    topK: 5
    vectorField: ${DASHVECTOR_VECTOR_FIELD:embedding}
